<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Quick Notes</h1>

    <p id="storage-warning" class="warning" role="alert" hidden></p>

    <form id="add-form" class="add-form">
      <label for="add-text">New note</label>
      <textarea id="add-text" rows="3"></textarea>
      <p id="add-error" class="field-error" role="alert" hidden></p>
      <button id="add-submit" class="primary" type="submit">Add note</button>
    </form>

    <div class="search" role="search">
      <label for="search">Search notes</label>
      <input id="search" type="search" autocomplete="off">
    </div>

    <section id="list-area" class="list-area" aria-label="Notes"></section>

    <div id="status" class="visually-hidden" role="status" aria-atomic="true"></div>
  </main>

  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
