<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Todo List</h1>

    <p id="storage-warning" class="warning" role="alert" hidden></p>

    <form id="add-form" class="add-form">
      <label for="add-title">New task</label>
      <div class="add-row">
        <input id="add-title" type="text" autocomplete="off">
        <button id="add-submit" class="primary" type="submit">Add task</button>
      </div>
      <p id="add-error" class="field-error" role="alert" hidden></p>
    </form>

    <div class="toolbar">
      <div id="filters" class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <p id="counts" class="counts">0 total, 0 completed</p>
    </div>

    <section id="list-area" class="list-area" aria-label="Tasks"></section>

    <div id="status" class="visually-hidden" role="status" aria-atomic="true"></div>
  </main>

  <script src="todos.js"></script>
  <script src="app.js"></script>
</body>
</html>
