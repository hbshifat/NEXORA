<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do</h1>
      <span id="stats-badge" class="badge"></span>
    </header>

    <form id="add-form" class="add-form">
      <input
        id="new-task-title"
        type="text"
        placeholder="What needs doing?"
        autocomplete="off"
        maxlength="200"
      >
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div id="filters" class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="is-active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" type="button" class="clear-completed" hidden>Clear completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No tasks found. Enjoy your day!</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
